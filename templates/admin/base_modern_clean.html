<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLS TRAVELS - Admin Portal</title>
    
    <!-- CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/modern-admin.css') }}" rel="stylesheet">
</head>

<body class="admin-layout">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-content">
            <!-- Brand -->
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <i class="fas fa-truck" aria-hidden="true"></i>
                </div>
                <div class="brand-text">
                    <span class="brand-name">PLS TRAVELS</span>
                    <span class="brand-tagline">Admin Portal</span>
                </div>
            </div>
            
            <!-- Navigation Menu -->
            <div class="nav-content">
                <!-- Main Section -->
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <ul class="nav-menu" role="menu">
                        <!-- Dashboard -->
                        <li class="nav-item" role="none">
                            <a href="{{ url_for('admin.dashboard') }}" 
                               class="nav-link {{ 'active' if request.endpoint == 'admin.dashboard' else '' }}" 
                               role="menuitem">
                                <div class="nav-icon">
                                    <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
                                </div>
                                <span class="nav-text">Dashboard</span>
                            </a>
                        </li>
                        
                        <!-- Drivers -->
                        <li class="nav-item" role="none">
                            <a href="{{ url_for('admin.drivers') }}" 
                               class="nav-link {{ 'active' if request.endpoint == 'admin.drivers' else '' }}" 
                               role="menuitem">
                                <div class="nav-icon">
                                    <i class="fas fa-users" aria-hidden="true"></i>
                                </div>
                                <span class="nav-text">Drivers</span>
                            </a>
                        </li>
                        
                        <!-- Vehicles -->
                        <li class="nav-item" role="none">
                            <a href="{{ url_for('admin.vehicles') }}" 
                               class="nav-link {{ 'active' if request.endpoint == 'admin.vehicles' else '' }}" 
                               role="menuitem">
                                <div class="nav-icon">
                                    <i class="fas fa-car" aria-hidden="true"></i>
                                </div>
                                <span class="nav-text">Vehicles</span>
                            </a>
                        </li>
                        
                        <!-- Duties -->
                        <li class="nav-item" role="none">
                            <a href="{{ url_for('admin.duties') }}" 
                               class="nav-link {{ 'active' if request.endpoint == 'admin.duties' else '' }}" 
                               role="menuitem">
                                <div class="nav-icon">
                                    <i class="fas fa-clipboard-list" aria-hidden="true"></i>
                                </div>
                                <span class="nav-text">Duties</span>
                            </a>
                        </li>
                        
                        <!-- Reports -->
                        <li class="nav-item" role="none">
                            <a href="{{ url_for('admin.reports') }}" 
                               class="nav-link {{ 'active' if request.endpoint == 'admin.reports' else '' }}" 
                               role="menuitem">
                                <div class="nav-icon">
                                    <i class="fas fa-chart-bar" aria-hidden="true"></i>
                                </div>
                                <span class="nav-text">Reports</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" role="main">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="{{ url_for('admin.dashboard') }}" class="breadcrumb-link">Home</a>
                    {% if request.endpoint != 'admin.dashboard' %}
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-current">{{ self.title() or 'Page' }}</span>
                    {% endif %}
                </nav>
            </div>
            
            <div class="top-bar-center">
                <div class="search-container">
                    <div class="search-icon">
                        <i class="fas fa-search"></i>
                    </div>
                    <input type="text" 
                           class="search-input" 
                           placeholder="Search..." 
                           aria-label="Global search">
                </div>
            </div>
            
            <div class="top-bar-right">
                <div class="user-menu-container">
                    <button class="user-menu-toggle" id="user-menu-toggle" aria-expanded="false" aria-haspopup="true">
                        <div class="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <span class="user-name">{{ current_user.username if current_user.is_authenticated else 'User' }}</span>
                        <i class="fas fa-chevron-down user-chevron"></i>
                    </button>
                    
                    <div class="user-menu" id="user-menu">
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-user mr-2"></i>Profile
                        </a>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-cog mr-2"></i>Settings
                        </a>
                        <div class="border-t border-gray-100"></div>
                        <a href="{{ url_for('auth.logout') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-sign-out-alt mr-2"></i>Logout
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Sidebar toggle
        document.getElementById('sidebar-toggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });
        
        // User menu toggle
        document.getElementById('user-menu-toggle').addEventListener('click', function() {
            const menu = document.getElementById('user-menu');
            const isExpanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', !isExpanded);
            menu.classList.toggle('show');
        });
        
        // Close user menu when clicking outside
        document.addEventListener('click', function(event) {
            const userMenuContainer = document.querySelector('.user-menu-container');
            if (!userMenuContainer.contains(event.target)) {
                const menu = document.getElementById('user-menu');
                const toggle = document.getElementById('user-menu-toggle');
                menu.classList.remove('show');
                toggle.setAttribute('aria-expanded', 'false');
            }
        });
    </script>
</body>
</html>
