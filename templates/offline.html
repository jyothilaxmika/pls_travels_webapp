<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - PLS TRAVELS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 4rem;
            color: #00d4ff;
            margin-bottom: 2rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0284c7 100%);
            border: none;
            color: #0f172a;
            font-weight: 700;
            border-radius: 12px;
            padding: 0.75rem 2rem;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0284c7 0%, #00d4ff 100%);
            color: #0f172a;
        }
        .feature-list {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 1.5rem;
            margin: 2rem 0;
        }
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        .feature-icon {
            color: #00d4ff;
            margin-right: 1rem;
            width: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        
        <h1 class="h2 mb-3">You're Offline</h1>
        <p class="lead mb-4">
            No internet connection available. Don't worry - PLS TRAVELS works offline too!
        </p>
        
        <div class="feature-list">
            <h5 class="mb-3"><i class="fas fa-check-circle me-2"></i>Available Offline:</h5>
            
            <div class="feature-item">
                <i class="fas fa-tachometer-alt feature-icon"></i>
                <span>View your dashboard</span>
            </div>
            
            <div class="feature-item">
                <i class="fas fa-user feature-icon"></i>
                <span>Access your profile</span>
            </div>
            
            <div class="feature-item">
                <i class="fas fa-clock feature-icon"></i>
                <span>Check previous duty records</span>
            </div>
            
            <div class="feature-item">
                <i class="fas fa-rupee-sign feature-icon"></i>
                <span>Review earnings history</span>
            </div>
            
            <div class="feature-item">
                <i class="fas fa-sync feature-icon"></i>
                <span>Data syncs when online</span>
            </div>
        </div>
        
        <button class="btn btn-primary" onclick="window.location.reload()">
            <i class="fas fa-redo me-2"></i>Try Again
        </button>
        
        <div class="mt-4">
            <small class="text-muted">
                <i class="fas fa-info-circle me-1"></i>
                Your data will sync automatically when connection is restored
            </small>
        </div>
    </div>

    <script>
        // Auto-retry when online
        window.addEventListener('online', () => {
            console.log('Connection restored, redirecting...');
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        });

        // Check connection status
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }

        // Check every 30 seconds
        setInterval(checkConnection, 30000);
    </script>
</body>
</html>
