<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLS TRAVELS - Offline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .offline-container {
            text-align: center;
            color: white;
            max-width: 500px;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        .offline-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .offline-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
            transform: translateY(-2px);
        }
        .feature-list {
            text-align: left;
            margin: 2rem 0;
        }
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            opacity: 0.9;
        }
        .feature-icon {
            width: 30px;
            text-align: center;
            margin-right: 15px;
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        
        <h1 class="offline-title">You're Offline</h1>
        
        <p class="offline-message">
            No internet connection found. Check your connection and try again.
        </p>
        
        <div class="feature-list">
            <div class="feature-item">
                <i class="fas fa-database feature-icon"></i>
                <span>Your data is safely stored offline</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-camera feature-icon"></i>
                <span>Camera and photos work offline</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-sync feature-icon"></i>
                <span>Data will sync when you're back online</span>
            </div>
        </div>
        
        <button class="btn retry-btn" onclick="location.reload()">
            <i class="fas fa-redo me-2"></i>
            Try Again
        </button>
        
        <div class="mt-4">
            <small class="opacity-75">
                <i class="fas fa-shield-alt me-1"></i>
                PLS TRAVELS works offline to keep you productive
            </small>
        </div>
    </div>
    
    <script>
        // Auto-retry when online
        window.addEventListener('online', () => {
            setTimeout(() => {
                location.reload();
            }, 1000);
        });
        
        // Show connection status
        const showConnectionStatus = () => {
            const status = navigator.onLine ? 'online' : 'offline';
            const color = navigator.onLine ? '#10b981' : '#ef4444';
            
            const statusBadge = document.createElement('div');
            statusBadge.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${color};
                color: white;
                padding: 8px 16px;
                border-radius: 20px;
                font-size: 0.9rem;
                font-weight: 600;
                z-index: 1000;
            `;
            statusBadge.innerHTML = `
                <i class="fas fa-${navigator.onLine ? 'wifi' : 'wifi-slash'} me-1"></i>
                ${status.toUpperCase()}
            `;
            
            document.body.appendChild(statusBadge);
            
            if (navigator.onLine) {
                setTimeout(() => {
                    statusBadge.remove();
                    location.reload();
                }, 2000);
            }
        };
        
        window.addEventListener('online', showConnectionStatus);
        window.addEventListener('offline', showConnectionStatus);
        
        // Show current status on load
        showConnectionStatus();
    </script>
</body>
</html>
